services:
  - name: backup-db-lite
    type: cron
    schedule: "0 3 1 * *"
    region: frankfurt
    env: docker
    plan: standard
    dockerfilePath: ./Dockerfile
    autoDeploy: false
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mba-db-prod-pg18
          property: connectionString
      # pick the region closest to your database
      # For example, us-west-2 for the Oregon region
      - key: AWS_REGION
        sync: false 
      # A globally unique name for your bucket
      # For example, <your-username>-<database name>-render-postgres-backups
      - key: S3_BUCKET_NAME
        sync: false
      # Looks like "AKIAXXXXXXXXXXXXXXXX"
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      # Major version of the Postgres instance (18 since 2026-10-04). Selects the
      # postgres:<version>-alpine base image, hence the pg_dump version.
      - key: POSTGRES_VERSION
        sync: false

